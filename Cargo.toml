[package]
name = "control4-navigator-sink-lib"
version = "0.1.0"
edition = "2021"
description = "Wire protocol + sink for emulating a Control4 on-screen navigator: receive room/navigation commands relayed from a DriverWorks controller-proxy driver, and model the state a navigator holds."
license = "MIT"
repository = "https://github.com/The1TrueJoe/control4-navigator-sink-lib"
keywords = ["control4", "home-automation", "navigator", "driverworks"]
categories = ["network-programming", "parser-implementations"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]

[features]
default = ["sink"]
# `sink` pulls in the std TcpListener server. Parsing/model are always available
# (so a consumer like control4-fake-navigator can feed frames from any transport).
sink = []
